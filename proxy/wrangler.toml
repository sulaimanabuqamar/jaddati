name = "jaddati-proxy"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Slots come back on their own. Without this the account fills once and
# stays full, and the demo cannot create a voice.
#
# Every ten minutes, not nightly: during a demonstration the account has to
# clear itself between people, and a voice left behind by the last visitor is
# a slot the next one cannot have.
[triggers]
crons = ["*/10 * * * *"]

[vars]
# How many characters of speech one device may spend in a calendar month.
# One page of a book is roughly 900, so 1000 is about a page — enough for
# someone handed the phone to type a few real sentences and hear them back,
# without one visitor draining the account.
CREDITS_PER_DEVICE = "1000"

# Ceiling on shared voices alive at once, ACROSS everyone. Set this BELOW the
# number of slots the plan actually has, so the demo always has room.
MAX_VOICES = "6"

# How long a shared voice lives before the sweep removes it, in minutes.
#
# The sweep runs every ten minutes and removes anything already older than
# this, so a voice gets between ten and twenty minutes — never less than ten,
# which is what stops it vanishing from under someone mid-demonstration.
# The app says so on the screen where a voice is made; if this number changes,
# that sentence has to change with it.
VOICE_TTL_MINUTES = "10"

LLM_BASE_URL = "https://api.groq.com/openai/v1"

# Optional Google sign-in. Leave the id empty and the app never offers it —
# /google/status answers "not configured" and the row stays hidden, so an
# unfinished setup cannot put a dead button in front of anyone.
#
# The id is public by design (it goes in the URL the browser opens). The
# SECRET is not, and is set the same way as the others:
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
GOOGLE_CLIENT_ID = ""


# Secrets are NOT set here — they would end up in git. Set them with:
#   npx wrangler secret put ELEVENLABS_API_KEY
#   npx wrangler secret put LLM_API_KEY
#   npx wrangler secret put APP_TOKEN

[[kv_namespaces]]
binding = "JADDATI"
id = "72696b66453e4baa8b23d64d20dcc959"

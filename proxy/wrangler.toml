name = "jaddati-proxy"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# The collector behind the eviction, not the mechanism itself.
#
# This used to run every ten minutes and delete EVERY voice, which is how the
# account cleared itself between visitors. That took the voice of whoever
# happened to be mid-sentence just as readily as one nobody had touched for an
# hour. A seventh person now takes the least recently used slot at the moment
# they need it, and this sweep only clears voices nobody has spoken with for a
# whole day — the ones whose owner is not coming back today.
#
# Kept at ten minutes even so: the run is cheap, it only ever touches records
# older than a day, and a slower schedule would mean a dead voice sitting in a
# slot for hours before anything noticed.
[triggers]
crons = ["*/10 * * * *"]

[vars]
# How many characters of speech one device may spend in a calendar month.
# One page of a book is roughly 900, so this is a few pages — enough for
# someone handed the phone to type real sentences and hear them back, without
# one visitor draining the account.
#
# Must be at least Config.maxCharactersPerGeneration (2500), or a visitor who
# has spent nothing is refused their first sentence and told the month's
# allowance is used up. Raise it if you want a visitor to get more than one
# full-length generation — this is the minimum coherent value, not a generous
# one.
# Per signed-in account, per month.
#
# READ THIS BEFORE CHANGING IT, AND READ IT BEFORE DEMO DAY.
#
# 1000 is what was asked for, and it is NOT a generous number. The compose box
# counts up to 800 characters and a book page is about 900, so one account gets
# roughly one long message, or two short ones, or a single page of a book — and
# then it is done until the calendar month turns over.
#
# It is also below maxCharactersPerGeneration (2500) on both clients, which
# means somebody who types a genuinely long message is refused on their first
# attempt and told their allowance is used up, having spent nothing. The relay
# says how much is left in that refusal, so it is not a lie, but it will read
# as one.
#
# If judges are going to scan the poster and try it, this wants to be 3000 or
# more. It is one line and one `npx wrangler deploy`.
CREDITS_PER_ACCOUNT = "1000"

# Only the question endpoint still meters by device; speech and cloning moved to
# the account above. Left in place because /chat/completions has no sign-in.
CREDITS_PER_DEVICE = "2500"

# And a ceiling across EVERYONE for the month. The per-device meter is keyed on
# a header the caller writes, so clearing site data mints a new one — it is
# friction, not a limit. This is the number that protects the bill.
#
# Note what it costs when it trips: speech stops for EVERY visitor until the
# calendar month rolls over, and there is no reset except editing the KV key
# `used:all:<YYYY-MM>` by hand. At 2500 per device that is 200 devices. Check
# it against the ElevenLabs plan before a busy day rather than after.
CREDITS_PER_MONTH = "500000"

# Questions and dictation per device per month. Groq is cheap, but the relay
# token is published in the web build, so without a ceiling it is an open
# language model on our key.
ASKS_PER_DEVICE = "200"

# Ceiling on shared voices alive at once, ACROSS everyone. Set this BELOW the
# number of slots the plan actually has, so the demo always has room.
MAX_VOICES = "6"

# How long a shared voice lives before the sweep removes it, in minutes.
#
# The sweep runs every ten minutes and removes anything already older than
# this, so a voice gets between ten and twenty minutes — never less than ten,
# which is what stops it vanishing from under someone mid-demonstration.
# The app says so on the screen where a voice is made; if this number changes,
# that sentence has to change with it.
VOICE_TTL_MINUTES = "10"

LLM_BASE_URL = "https://api.groq.com/openai/v1"

# Optional Google sign-in. Leave the id empty and the app never offers it —
# /google/status answers "not configured" and the row stays hidden, so an
# unfinished setup cannot put a dead button in front of anyone.
#
# The id is public by design (it goes in the URL the browser opens). The
# SECRET is not, and is set the same way as the others:
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
GOOGLE_CLIENT_ID = "1095337789662-6go3m02k3hiur7a5sd2jmorfflqu8b2k.apps.googleusercontent.com"
# The phone signs in with its own client id, so a token minted there carries a
# different audience. Both are public identifiers, not secrets — the secret is
# GOOGLE_CLIENT_SECRET, which is set with `wrangler secret put` and is not here.
GOOGLE_IOS_CLIENT_ID = "1095337789662-c6udbufnu3ua8ogvi06e1462vp62fmro.apps.googleusercontent.com"


# Secrets are NOT set here — they would end up in git. Set them with:
#   npx wrangler secret put ELEVENLABS_API_KEY
#   npx wrangler secret put LLM_API_KEY
#   npx wrangler secret put APP_TOKEN
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
#
# And one more, for the roll of who has signed in at docs/admin/:
#   npx wrangler secret put ADMIN_TOKEN
#
# Pick anything long and random; nothing else uses it and nothing has to know
# it but you. Until it is set, /admin/accounts answers 401 to everyone —
# including you — which is the right way round for a page anyone can open.

[[kv_namespaces]]
binding = "JADDATI"
id = "72696b66453e4baa8b23d64d20dcc959"

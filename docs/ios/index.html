<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jaddati — iPhone</title>

<!-- ────────────────────────────────────────────────────────────────
     CHANGE THIS ONE LINE TO RE-POINT THE QR CODE ON THE POSTER.
     Leave it as "" and this page shows the holding card instead.
     ──────────────────────────────────────────────────────────────── -->
<script>const DESTINATION = "";</script>

<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; background: #F9F5EF; color: #302725;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    display: grid; place-items: center; padding: 24px;
  }
  .card {
    max-width: 420px; width: 100%; background: #FEFAF5; border: 1px solid #E4DCD3;
    border-radius: 20px; padding: 36px 30px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .mark { width: 64px; height: 64px; }
  .name { font-family: Georgia, serif; font-size: 15px; letter-spacing: 0.24em; color: #592C43; }
  h1 { font-family: Georgia, serif; font-weight: 400; font-size: 27px; line-height: 1.25; margin: 4px 0 0; }
  p { margin: 0; font-size: 15px; line-height: 1.6; color: #766861; }
  a.btn {
    margin-top: 6px; display: inline-block; text-decoration: none;
    background: #592C43; color: #F8EFE4; font-size: 15px; font-weight: 600;
    padding: 14px 26px; border-radius: 15px;
  }
  a.btn:hover { background: #3E2031; }
  a.quiet { color: #592C43; font-size: 14px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card" id="holding">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true" fill="none"
         stroke="#592C43" stroke-width="5" stroke-linejoin="round">
      <g transform="translate(50,50)">
        <g><path d="M0 -8 A22 22 0 0 1 0 -46 A22 22 0 0 1 0 -8 Z"/></g>
        <g transform="rotate(60)"><path d="M0 -8 A22 22 0 0 1 0 -46 A22 22 0 0 1 0 -8 Z"/></g>
        <g transform="rotate(120)"><path d="M0 -8 A22 22 0 0 1 0 -46 A22 22 0 0 1 0 -8 Z"/></g>
        <g transform="rotate(180)"><path d="M0 -8 A22 22 0 0 1 0 -46 A22 22 0 0 1 0 -8 Z"/></g>
        <g transform="rotate(240)"><path d="M0 -8 A22 22 0 0 1 0 -46 A22 22 0 0 1 0 -8 Z"/></g>
        <g transform="rotate(300)"><path d="M0 -8 A22 22 0 0 1 0 -46 A22 22 0 0 1 0 -8 Z"/></g>
      </g>
    </svg>
    <div class="name">JADDATI</div>
    <h1>Not open for testers yet</h1>
    <p>The TestFlight invite goes live once the app is approved. Scan this same code again then — it will take you straight there.</p>
    <a class="btn" href="https://github.com/sulaimanabuqamar/jaddati">See the source code</a>
    <p style="font-size:13px">Smart Mobile Application Contest 2026 · Khalifa University</p>
  </div>

  <script>
    if (DESTINATION) {
      document.getElementById("holding").classList.add("hidden");
      location.replace(DESTINATION);
    }
  </script>
  <noscript>
    <p style="text-align:center">
      <a href="https://github.com/sulaimanabuqamar/jaddati">Continue to Jaddati</a>
    </p>
  </noscript>
</body>
</html>
